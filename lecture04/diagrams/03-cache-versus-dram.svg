<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" aria-label="Source requests and the cache"><rect width="1200" height="590" fill="#fcf8ed"/><path d="M30 79 H1170 M30 542 H1170" stroke="#bfb4a3" stroke-width="2"/><text x="45" y="55" font-size="29" font-family="monospace" fill="#2d3034">Source requests and the cache</text><rect x="65" y="164" width="265" height="74" rx="9" fill="#e0ecdd" stroke="#555148" stroke-width="2"/><text x="80" y="207" font-size="21" font-family="monospace" fill="#2d3034">load byte 0x104</text><rect x="65" y="315" width="265" height="74" rx="9" fill="#e0ecdd" stroke="#555148" stroke-width="2"/><text x="80" y="359" font-size="21" font-family="monospace" fill="#2d3034">load byte 0x108</text><path d="M336 202 L511 245" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><path d="M336 349 L511 303" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><rect x="514" y="208" width="343" height="170" rx="9" fill="#f2e1ba" stroke="#555148" stroke-width="2"/><text x="537" y="249" font-size="23" font-family="monospace" fill="#2d3034">128-byte cache line</text><text x="537" y="298" font-size="21" font-family="monospace" fill="#2d3034">32-byte sectors</text><text x="537" y="349" font-size="18" font-family="monospace" fill="#2d3034">cache hit? unknown</text><path d="M860 287 L960 287" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><rect x="964" y="253" width="176" height="77" rx="9" fill="#dddfe7" stroke="#555148" stroke-width="2"/><text x="1000" y="292" font-size="24" font-family="monospace" fill="#2d3034">DRAM</text><text x="981" y="316" font-size="16" font-family="monospace" fill="#2d3034">bytes unknown</text><text x="80" y="490" font-size="21" font-family="monospace" fill="#2d3034">Source reads do not reveal actual DRAM traffic.</text><text x="44" y="571" font-size="16" font-family="monospace" fill="#2d3034">Cache residency and external transfers need separate observations.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#394b58"/></marker></defs></svg>