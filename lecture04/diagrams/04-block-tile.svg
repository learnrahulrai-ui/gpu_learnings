<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" aria-label="Private scratchpad for each CUDA block"><rect width="1200" height="590" fill="#fcf8ed"/><path d="M30 79 H1170 M30 542 H1170" stroke="#bfb4a3" stroke-width="2"/><text x="45" y="55" font-size="29" font-family="monospace" fill="#2d3034">Private scratchpad for each CUDA block</text><rect x="70" y="151" width="475" height="287" rx="9" fill="#f1eee5" stroke="#555148" stroke-width="2"/><text x="90" y="189" font-size="22" font-family="monospace" fill="#2d3034">block A: threads 0..255</text><text x="90" y="237" font-size="19" font-family="monospace" fill="#2d3034">each thread writes tile[t]</text><rect x="93" y="261" width="426" height="89" rx="9" fill="#dfedd8" stroke="#555148" stroke-width="2"/><text x="115" y="300" font-size="23" font-family="monospace" fill="#2d3034">tile[0] = 0</text><text x="115" y="335" font-size="22" font-family="monospace" fill="#2d3034">tile[255] = 255</text><text x="100" y="396" font-size="17" font-family="monospace" fill="#2d3034">barrier -&gt; other thread may read</text><rect x="645" y="151" width="475" height="287" rx="9" fill="#f1eee5" stroke="#555148" stroke-width="2"/><text x="665" y="189" font-size="22" font-family="monospace" fill="#2d3034">block B: threads 256..511</text><text x="665" y="237" font-size="19" font-family="monospace" fill="#2d3034">each thread writes tile[t]</text><rect x="668" y="261" width="426" height="89" rx="9" fill="#dfedd8" stroke="#555148" stroke-width="2"/><text x="690" y="300" font-size="23" font-family="monospace" fill="#2d3034">tile[0] = 256</text><text x="690" y="335" font-size="22" font-family="monospace" fill="#2d3034">tile[255] = 511</text><text x="675" y="396" font-size="17" font-family="monospace" fill="#2d3034">barrier -&gt; other thread may read</text><text x="79" y="496" font-size="21" font-family="monospace" fill="#2d3034">No read arrow between separate software blocks.</text><text x="44" y="571" font-size="16" font-family="monospace" fill="#2d3034">One SM can host both blocks without joining their tile arrays.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#394b58"/></marker></defs></svg>