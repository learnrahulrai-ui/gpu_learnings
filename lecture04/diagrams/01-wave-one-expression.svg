<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" aria-label="One expression across different threads"><rect width="1200" height="590" fill="#fcf8ed"/><path d="M30 79 H1170 M30 542 H1170" stroke="#bfb4a3" stroke-width="2"/><text x="45" y="55" font-size="29" font-family="monospace" fill="#2d3034">One expression across different threads</text><text x="55" y="130" font-size="23" font-family="monospace" fill="#2d3034">idx = idx_y * 201 + idx_x; read u1[idx - 201]</text><rect x="70" y="172" width="298" height="92" rx="9" fill="#e0ecdd" stroke="#555148" stroke-width="2"/><text x="90" y="212" font-size="21" font-family="monospace" fill="#2d3034">thread (3,2)</text><text x="90" y="244" font-size="21" font-family="monospace" fill="#2d3034">idx=405</text><path d="M219 267 L219 360" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><rect x="98" y="374" width="240" height="77" rx="9" fill="#f2e1ba" stroke="#555148" stroke-width="2"/><text x="116" y="424" font-size="25" font-family="monospace" fill="#2d3034">u1[204]</text><rect x="445" y="172" width="298" height="92" rx="9" fill="#e0ecdd" stroke="#555148" stroke-width="2"/><text x="465" y="212" font-size="21" font-family="monospace" fill="#2d3034">thread (4,2)</text><text x="465" y="244" font-size="21" font-family="monospace" fill="#2d3034">idx=406</text><path d="M594 267 L594 360" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><rect x="473" y="374" width="240" height="77" rx="9" fill="#f2e1ba" stroke="#555148" stroke-width="2"/><text x="491" y="424" font-size="25" font-family="monospace" fill="#2d3034">u1[205]</text><rect x="820" y="172" width="298" height="92" rx="9" fill="#e0ecdd" stroke="#555148" stroke-width="2"/><text x="840" y="212" font-size="21" font-family="monospace" fill="#2d3034">thread (5,2)</text><text x="840" y="244" font-size="21" font-family="monospace" fill="#2d3034">idx=407</text><path d="M969 267 L969 360" fill="none" stroke="#394b58" stroke-width="3" marker-end="url(#arr)"/><rect x="848" y="374" width="240" height="77" rx="9" fill="#f2e1ba" stroke="#555148" stroke-width="2"/><text x="866" y="424" font-size="25" font-family="monospace" fill="#2d3034">u1[206]</text><text x="73" y="512" font-size="20" font-family="monospace" fill="#2d3034">Different threads, one source-level read expression.</text><text x="44" y="571" font-size="16" font-family="monospace" fill="#2d3034">A two-number wave place maps into one flat stored array.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#394b58"/></marker></defs></svg>